name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        id: version
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          test -f "docs/releases/$(cat VERSION).md"
          python3 -c 'import re; from pathlib import Path; assert re.fullmatch(r"\d+\.\d+\.\d+",Path("VERSION").read_text().strip())'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/navidpmb/tasklane-backend:${{ steps.version.outputs.version }},ghcr.io/navidpmb/tasklane-backend:latest
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/navidpmb/tasklane-frontend:${{ steps.version.outputs.version }},ghcr.io/navidpmb/tasklane-frontend:latest
      - name: Release archive
        run: |
          git archive --format=tar.gz --prefix=tasklane/ -o tasklane-${GITHUB_REF_NAME}.tar.gz HEAD
          sha256sum tasklane-${GITHUB_REF_NAME}.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "tasklane-${GITHUB_REF_NAME}.tar.gz" SHA256SUMS --title "Tasklane $GITHUB_REF_NAME" --notes-file "docs/releases/$(cat VERSION).md" --verify-tag
