name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: basecore_test
          POSTGRES_USER: basecore
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U basecore -d basecore_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-key-never-use-this-outside-of-continuous-integration
      DJANGO_DEBUG: "true"
      CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DATABASE_URL: postgresql://basecore:ci-only-password@localhost:5432/basecore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build


  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: docker build -f deploy/backend.Dockerfile -t tasklane-backend:standalone-test .
      - run: docker build -f deploy/frontend.Dockerfile -t tasklane-frontend:standalone-test .
      - run: python scripts/smoke_release.py
